name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: Conversor de Moneda v3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'Conversor de Moneda v3/pom.xml'
      - run: mvn -B test
